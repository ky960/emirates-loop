<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1417">
  <meta name="description" content="Ride the Emirates Loop indoors with your speed, cadence and heart-rate sensors.">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <title>Emirates Loop</title>
</head>
<body>
  <div class="app" id="app">
    <header class="top" id="top">
      <div class="brand"><h1>Emirates Loop</h1><span id="who"></span></div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" aria-selected="true" data-v="ride" id="t-ride">Ride</button>
        <button role="tab" aria-selected="false" data-v="history" id="t-history">History</button>
        <button role="tab" aria-selected="false" data-v="settings" id="t-settings">Settings</button>
      </nav>
      <div class="pills" id="pills" role="status" aria-live="polite"></div>
    </header>

    <!-- RIDE -->
    <section class="view view-ride" id="v-ride" role="tabpanel" aria-labelledby="t-ride">
      <div class="stage" id="stage">
        <canvas id="road" aria-label="3D road view"></canvas>
        <div id="map"></div>
        <div class="loading" id="loading"><div class="spinner"></div><p id="loadingTxt">Loading the map…</p></div>

        <div class="ov-top">
          <div class="next glass" id="nextCard">
            <small id="nextLbl">Next stop</small>
            <strong id="nextName">—</strong>
            <span id="nextSub"></span>
          </div>
          <div class="chips" id="chips">
            <span class="chip glass ghostc" id="ghostChip" hidden><i></i><span id="ghostTxt">Ghost</span><b id="ghostVal">0 m</b></span>
            <span class="chip glass warn" id="sensorChip" hidden></span>
            <span class="chip glass sim" id="simChip" hidden>Simulated</span>
          </div>
        </div>

        <div class="camsw glass" role="group" aria-label="Camera">
          <button data-cam="road" aria-pressed="true">Road</button>
          <button data-cam="map" aria-pressed="false">Map</button>
          <button data-cam="stage" aria-pressed="false">Stage</button>
          <button data-cam="loop" aria-pressed="false">Loop</button>
        </div>

        <div class="banner" id="banner" aria-live="polite"><small>Now arriving</small><strong id="bName"></strong><span id="bSub"></span></div>
        <div class="pausedov" id="pausedOv" hidden><strong>Paused</strong><span id="pausedSub">Pedal to resume</span></div>

        <div class="hud glass" id="hud">
          <div class="cell main"><small>Speed</small><strong><span id="hSpd">0.0</span><em>km/h</em></strong></div>
          <div class="cell"><small>Cadence</small><strong><span id="hCad">—</span><em>rpm</em></strong></div>
          <div class="cell hr" id="hrCell"><small>Heart rate <b id="hZone"></b></small><strong><span id="hHr">—</span><em>bpm</em></strong><div class="zbar"><i id="hZoneBar"></i></div></div>
          <div class="cell"><small>Gradient</small><strong><span id="hGrade">0.0</span><em>%</em></strong></div>
          <div class="cell pw" id="pwCell" hidden><small id="pwLbl">Power</small><strong><span id="hPw">—</span><em>W</em></strong></div>
          <div class="cell"><small>Ride</small><strong><span id="hKm">0.00</span><em>km</em></strong></div>
          <div class="cell"><small>Time</small><strong id="hTime">0:00:00</strong></div>
        </div>
        <div class="profile glass" id="profileStrip">
          <span class="ends" id="pFrom"></span>
          <canvas id="profileCv" aria-label="Elevation profile of this stage"></canvas>
          <span class="ends" id="pTo"></span>
        </div>
        <div class="attr" id="attr"></div>
      </div>

      <div class="simbar" id="simBar" hidden>
        <label for="simSpd">Simulated speed</label>
        <input id="simSpd" type="range" min="0" max="60" step="0.5" value="28">
        <output id="simOut" for="simSpd">28.0 km/h</output>
        <button class="btn sm ghost" id="simStop">Stop simulation</button>
      </div>
      <div class="controls" id="controls"></div>
    </section>

    <!-- HISTORY -->
    <section class="view" id="v-history" role="tabpanel" aria-labelledby="t-history" hidden></section>

    <!-- SETTINGS -->
    <section class="view" id="v-settings" role="tabpanel" aria-labelledby="t-settings" hidden></section>
  </div>

  <div class="sheet-wrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
